<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factory Inventory Management System</title>
  <script>
    // Runs before first paint so a saved dark theme does not flash light. Key must match useTheme.js.
    (function () {
      var theme = 'light';
      try {
        if (localStorage.getItem('app-theme') === 'dark') theme = 'dark';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
